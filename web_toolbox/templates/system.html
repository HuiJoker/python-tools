{% extends "base.html" %}{% block content %}<a class="back" href="/">← 返回工具</a><h1>运行环境</h1><p class="muted">所有能力都在当前电脑本地执行。</p><section class="health-grid">{% for name, item in health.items() %}<article class="panel health-card"><span class="health-dot {{ 'ok' if item.ok else 'bad' }}"></span><h2>{{ name }}</h2><p>{{ '已就绪' if item.ok else '需要配置' }}</p><code>{{ item.detail }}</code></article>{% endfor %}</section>{% endblock %}
